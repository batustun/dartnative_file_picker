# Static analysis for file_picker.
#
# Run with `dn analyze` (the DartNative CLI), which treats infos and warnings
# as fatal by default — keep this file clean rather than suppressing findings.

include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A public API that ships without documentation is a defect here.
    public_member_api_docs: warning

linter:
  rules:
    # Public API hygiene.
    public_member_api_docs: true
    always_declare_return_types: true
    avoid_catching_errors: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unnecessary_lambdas: true
    use_super_parameters: true
    # This package crosses an FFI boundary; silent failures are unacceptable.
    avoid_catches_without_on_clauses: true
    only_throw_errors: false
